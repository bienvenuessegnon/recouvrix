services:
  - type: web
    name: recouvrix
    runtime: node
    plan: free
    region: frankfurt
    branch: main
    buildCommand: npm ci && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3847"
      - key: SESSION_TTL_MINUTES
        value: "480"
      - key: DEMO_ADMIN_PASSWORD
        sync: false
      - key: DEMO_MANAGER_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
